name: Docker Image CI (multi-arch)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - id: commit
      uses: prompt/actions-commit-hash@v3

    - id: time
      name: Get Time Stamp
      uses: nanzm/get-time-action@v2.0
      with:
        timeZone: UTC+8
        format: "YYYYMMDDHHmmss"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push multi-arch image
      id: build_push
      env:
        tag: "v1-${{ steps.time.outputs.time }}-${{ steps.commit.outputs.short }}"
      uses: docker/build-push-action@v6
      with:
        context: ./container-images/init/
        file: ./container-images/init/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          wchstu/ml-stack-init:${{ env.tag }}
          wchstu/ml-stack-init:v1
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build amd64-only fallback
      if: failure()
      env:
        tag: "v1-${{ steps.time.outputs.time }}-${{ steps.commit.outputs.short }}"
      run: |
        cd ./container-images/init/
        docker buildx build           --platform linux/amd64           --tag wchstu/ml-stack-init:$tag           --tag wchstu/ml-stack-init:v1           --push .
