apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      initContainers:
      - name: cp
        command:
        - bash
        - -c
        - cp -r /nix/store/* /cp/nix/store/ && cp -r /ml-stack-init/* /cp/ml-stack-init/ && chmod +x ml-stack-init/setup.sh
        image: "wchstu/ml-stack-init:v1"
        imagePullPolicy: Always
        volumeMounts:
        - mountPath: /cp/nix/store/
          name: nix-store
        - mountPath: /cp/ml-stack-init/
          name: init
      containers:
      - name: main
        command:
        - bash 
        - -c
        - /ml-stack-init/setup.sh
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SSH_PUBLIC_KEY
          valueFrom:
            configMapKeyRef:
              key: pubkey
              name: {{ .Values.ssh.name }}
        - name: SSH_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              key: password
              name: {{ .Values.ssh.name }}
        ports:
        - name: {{ .Values.service.name }}
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      hostname: {{ .Values.name }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
